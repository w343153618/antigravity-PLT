plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pailie3.store'
    compileSdk 35

    defaultConfig {
        applicationId "com.pailie3.store"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
}
