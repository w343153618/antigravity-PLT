<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#176458">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="门店工作台">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>门店档案 · 事后对账工作台</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
<div id="app" v-cloak>
  <main v-if="!session" class="auth-shell">
    <section class="auth-panel" aria-labelledby="login-title">
      <div class="auth-brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 26V8h9v18M18 26V14h9v12M3 26h26M8 12h3m-3 5h3m10 1h3m-3 4h3"/></svg><span>门店档案</span></div>
      <h1 id="login-title">登录工作台</h1>
      <p v-if="authChecking" class="auth-checking" role="status">正在确认登录状态…</p>
      <form v-else @submit.prevent="login">
        <label>账号<input v-model.trim="loginForm.username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required :disabled="authBusy || logoutUnconfirmed"></label>
        <label>密码<input v-model="loginForm.password" name="password" type="password" autocomplete="current-password" required :disabled="authBusy || logoutUnconfirmed"></label>
        <button type="submit" class="primary wide" :disabled="authBusy || logoutUnconfirmed">{{ authBusy ? '正在处理…' : '登录' }}</button>
        <p v-if="authError" id="login-error" tabindex="-1" class="notice error" role="alert">{{ authError }}</p>
        <button v-if="logoutUnconfirmed" type="button" class="wide" :disabled="authBusy" @click="logout">重试退出</button>
      </form>
    </section>
  </main>
  <template v-else>
  <aside class="rail">
    <a class="brand" href="#workspace" @click.prevent="switchView('workspace')" aria-label="门店档案，返回当前工作台"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 26V8h9v18M18 26V14h9v12M3 26h26M8 12h3m-3 5h3m10 1h3m-3 4h3"/></svg><span>门店档案</span></a>
    <nav aria-label="主导航">
      <button v-if="role !== 'manager'" type="button" :class="{ active: view === 'today' }" :aria-current="view === 'today' ? 'page' : undefined" @click="switchView('today')"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>今日策略</button>
      <button v-if="role !== 'manager'" type="button" :class="{ active: view === 'calendar' }" :aria-current="view === 'calendar' ? 'page' : undefined" @click="switchView('calendar')"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h2m4 0h2m-8 3h2"/></svg>战绩日历</button>
      <button type="button" :class="{ active: view === 'workspace' }" :aria-current="view === 'workspace' ? 'page' : undefined" @click="switchView('workspace')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v11h16V10M2 10l3-7h14l3 7M2 10h20M9 21v-7h6v7"/></svg>{{ roleTitle }}</button>
      <button v-if="role === 'client'" type="button" @click="openCustomOrder" style="margin-top: 8px; color: var(--green);"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m12 8 4 4-4 4M8 12h8"/></svg>自主选号</button>
    </nav>
  </aside>
  <div class="app-body">
    <header class="topbar">
      <div class="mobile-brand">门店档案</div><span v-if="bootstrap.demo" class="demo-badge">模拟数据</span><span class="topbar-date">{{ bootstrap.today || '正在读取' }}</span>
      <div class="account-scope"><span class="account-name">{{ session.username }}<small>{{ roleLabel }}</small></span><button type="button" @click="logout" :disabled="authBusy || !!pending">退出登录</button></div>
    </header>
    <main id="main-content">
      <div class="page-heading"><div><h1>{{ title }}</h1><p v-if="role === 'client' && client">{{ client.name }} · {{ store?.name }}</p><p v-else-if="role === 'manager' && store">{{ store.name }} · {{ manager?.name }}</p></div><div style="display: flex; gap: 10px; align-items: center;"><button v-if="role === 'client'" type="button" class="primary" @click="openCustomOrder" :disabled="loading || scopeLoading || !client || !!pending" style="display: flex; align-items: center; gap: 6px;"><svg viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2;" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m12 8 4 4-4 4M8 12h8"/></svg>自主选号</button><button v-if="view === 'workspace' && role === 'manager'" type="button" class="primary" @click="openOrder" :disabled="loading || scopeLoading || !store || !!pending">登记已完成业务<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div></div>
      <div v-if="error" class="notice error" role="alert"><span>{{ error }}</span><button type="button" @click="initialize" :disabled="loading">重新加载</button></div>
      <div v-if="loading" class="loading-shell" role="status"><p>正在读取当前角色数据…</p><div></div><div></div><div></div></div>
      <template v-else>
        <section v-if="role !== 'manager' && view === 'today'" class="today-view">
          <div class="section-heading">
            <h2>{{ shortDate(bootstrap.today) }} 今日策略</h2>
            <div style="display: flex; gap: 8px; align-items: center;">
              <button v-if="role === 'client'" type="button" class="primary" style="min-height: 36px; padding: 4px 14px; font-size: 0.85rem;" @click="openCustomOrder">🎯 自主选号</button>
              <button v-if="role === 'hq'" type="button" class="primary" style="min-height: 36px; padding: 4px 12px; font-size: 0.8rem;" @click="openPortfolioDialog(!!portfolio)">{{ portfolio ? '编辑修改当日策略' : '发布今日策略' }}</button>
              <button v-if="role === 'client'" type="button" style="min-height: 36px; padding: 4px 12px; font-size: 0.8rem;" @click="loadGlobal" :disabled="loading">刷新最新策略</button>
            </div>
          </div>
          <div v-if="portfolio && portfolio.date === bootstrap.today" class="portfolio-grid">
            <article v-for="(combo, index) in portfolio.combos" :key="index" class="strategy">
              <div class="strategy-meta"><span>组合 {{ index + 1 }}</span><span>权重 {{ combo.weight }}</span></div>
              <div class="code-digits" :aria-label="'推荐号码 ' + combo.code"><span v-for="(digit, digitIndex) in combo.code" :key="digitIndex">{{ digit }}</span></div>
              <p v-if="combo.note">{{ combo.note }}</p>
              <div class="strategy-actions" style="margin-top: 14px; display: flex; gap: 8px;">
                <button v-if="role === 'client'" type="button" class="primary" style="min-height: 38px; padding: 6px 14px; font-size: 0.82rem;" @click="openFollow(combo)">立刻跟单</button>
                <button v-if="role === 'hq'" type="button" class="text-button" @click="editPortfolioToday">修改当日策略</button>
              </div>
            </article>
          </div>
          <div v-if="role === 'client' && portfolio && portfolio.date === bootstrap.today" class="custom-pick-banner" style="margin-top: 16px; padding: 18px 24px; background: var(--paper); border: 2px dashed #0c7a66; border-radius: var(--radius); display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;">
            <div style="display: flex; align-items: center; gap: 14px;">
              <span style="font-size: 1.8rem;" aria-hidden="true">🎯</span>
              <div>
                <h3 style="font-size: 1.05rem; margin: 0; color: #176458;">排列三自主选号</h3>
                <p style="margin: 2px 0 0; font-size: 0.85rem; color: var(--muted);">不跟推荐，自主选 3 位数字投注，支持自定义注数与倍投</p>
              </div>
            </div>
            <button type="button" class="primary" style="min-height: 38px; padding: 6px 18px; font-size: 0.85rem;" @click="openCustomOrder">
              🎯 立即自主选号
            </button>
          </div>
          <div v-else-if="!portfolio || portfolio.date !== bootstrap.today" class="empty mosaic-card" style="position: relative; overflow: hidden; padding: 48px 24px; background: #fdfefe; border: 2px dashed #b5cac2;">
            <div style="filter: blur(8px); opacity: 0.35; user-select: none; pointer-events: none;" aria-hidden="true">
              <div style="display: flex; justify-content: center; gap: 20px; font-size: 3rem; font-weight: bold; margin-bottom: 16px;">
                <span>8</span><span>5</span><span>2</span>
                <span style="margin: 0 10px;">|</span>
                <span>3</span><span>1</span><span>9</span>
                <span style="margin: 0 10px;">|</span>
                <span>6</span><span>7</span><span>4</span>
              </div>
            </div>
            <div style="position: relative; z-index: 2;">
              <h3 style="font-size: 1.25rem; color: #176458; margin-bottom: 8px;">今日策略编制中</h3>
              <p style="color: #60716d; font-size: 0.9rem;">尚未发布当日策略，请稍候刷新查看。</p>
              <div style="display: flex; justify-content: center; gap: 12px; margin-top: 14px;">
                <button v-if="role === 'client'" type="button" class="primary" @click="openCustomOrder">🎯 自主选号</button>
                <button v-if="role === 'hq'" type="button" class="primary" @click="openPortfolioDialog(false)">前往发布今日策略</button>
                <button type="button" class="primary" @click="loadGlobal" :disabled="loading">立即刷新策略</button>
              </div>
            </div>
          </div>
          <div class="today-secondary" style="grid-template-columns: 1fr; margin-top: 36px;">
            <section class="recent-panel">
              <div class="section-heading">
                <div>
                  <h2>近 30 天战绩日历</h2>
                  <p class="muted small">已核验 {{ verifiedCount }} 天 · 红 {{ hitCount }} 天 · 黑 {{ verifiedCount - hitCount }} 天 · 胜率 {{ verifiedCount ? Math.round(hitCount / verifiedCount * 100) : 0 }}%</p>
                </div>
                <div class="legend">
                  <span><i class="hit-dot"></i>红 / 命中 (Hit)</span>
                  <span><i class="miss-dot"></i>黑 / 未中 (Miss)</span>
                  <span><i></i>待核验</span>
                </div>
              </div>
              <div class="calendar-week" aria-hidden="true"><span v-for="weekday in ['一', '二', '三', '四', '五', '六', '日']" :key="weekday">{{ weekday }}</span></div>
              <div class="calendar-grid"><span v-for="blank in calendarPadding" :key="'blank-' + blank" aria-hidden="true"></span><button v-for="item in calendar" :key="item.date" type="button" :class="['day-cell', item.status ? item.status.toLowerCase() : 'pending-day', { 'is-today': item.date === bootstrap.today }]" @click="openDay(item)" :aria-label="item.date + '，' + statusLabel(item) + '，查看详情'"><span>{{ item.date.slice(5).replace('-', '/') }}</span><strong>{{ item.status === 'Hit' ? '红' : item.status === 'Miss' ? '黑' : '待' }}</strong><small>{{ item.date === bootstrap.today ? '今天' : item.status || '待核验' }}</small></button></div>
            </section>
          </div>
        </section>
        <section v-if="role !== 'manager' && view === 'calendar'" class="calendar-view">
          <div class="calendar-top"><div><h2>{{ calendar.length ? shortDate(calendar[0].date) + ' — ' + shortDate(calendar[calendar.length - 1].date) : '近 30 天' }}</h2><p class="muted small">已核验 {{ verifiedCount }} 天 · 红 {{ hitCount }} 天 · 黑 {{ verifiedCount - hitCount }} 天</p></div><div style="display: flex; gap: 12px; align-items: center;"><button v-if="role === 'hq'" type="button" class="primary" style="padding: 4px 12px; font-size: 0.8rem;" @click="syncOfficialLottery" :disabled="syncing">{{ syncing ? '同步中…' : '⚡ 同步体彩开奖' }}</button><div class="legend"><span><i class="hit-dot"></i>红 / Hit</span><span><i class="miss-dot"></i>黑 / Miss</span><span><i></i>待核验</span></div></div></div>
          <div class="calendar-week" aria-hidden="true"><span v-for="weekday in ['一', '二', '三', '四', '五', '六', '日']" :key="weekday">{{ weekday }}</span></div>
          <div class="calendar-grid"><span v-for="blank in calendarPadding" :key="'blank-' + blank" aria-hidden="true"></span><button v-for="item in calendar" :key="item.date" type="button" :class="['day-cell', item.status ? item.status.toLowerCase() : 'pending-day', { 'is-today': item.date === bootstrap.today }]" @click="openDay(item)" :aria-label="item.date + '，' + statusLabel(item) + '，查看详情'"><span>{{ item.date.slice(5).replace('-', '/') }}</span><strong>{{ item.status === 'Hit' ? '红' : item.status === 'Miss' ? '黑' : '待' }}</strong><small>{{ item.date === bootstrap.today ? '今天' : item.status || '待核验' }}</small></button></div>
        </section>
        <section v-if="view === 'workspace'" class="workspace-view">
          <div v-if="scopeError" class="notice error" role="alert"><span>{{ scopeError }}</span><button type="button" @click="loadScope(false)" :disabled="scopeLoading">重新读取</button></div>
          <p v-if="formError && failedForm.startsWith('voucher-')" id="workspace-form-error" tabindex="-1" class="notice error" role="alert">{{ formError }}</p>
          <div v-if="scopeLoading && !client && !orders.length && !clients.length && !audits.length" class="loading-shell" role="status"><p>正在读取当前档案范围…</p><div></div><div></div></div>
          <template v-else>
            <template v-if="role === 'client' && client">
              <dl class="metrics"><div><dt>个人往来对账结余</dt><dd>{{ money(client.reconciliationBalance) }}</dd></div><div><dt>店内存管待取</dt><dd>{{ storedCount }}<small> 份</small></dd></div><div><dt>归属店长</dt><dd class="person-value">{{ client.managerId ? managerName(client.managerId) : '待确认' }}</dd><span>{{ storeName(client.storeId) }}</span></div></dl>
              <div class="client-strategy-quick" style="background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; margin-bottom: 28px;">
                <div class="section-heading" style="margin-bottom: 14px;">
                  <div>
                    <h2 style="font-size: 1.15rem;">今日精选与自选</h2>
                  </div>
                  <div style="display: flex; gap: 10px; align-items: center;">
                    <button type="button" class="primary" style="padding: 4px 12px; font-size: 0.82rem;" @click="openCustomOrder">🎯 自主选号</button>
                    <button type="button" class="text-button" @click="switchView('today')">策略专页 <span aria-hidden="true">→</span></button>
                  </div>
                </div>
                <div v-if="portfolio && portfolio.date === bootstrap.today" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px;">
                  <div v-for="(combo, index) in portfolio.combos" :key="index" style="padding: 16px; background: var(--canvas); border-radius: 8px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                      <span class="muted small">组合 {{ index + 1 }}</span>
                      <strong class="number-code" style="font-size: 1.8rem; display: block; color: var(--green);">{{ combo.code }}</strong>
                    </div>
                    <button type="button" class="primary" style="min-height: 36px; padding: 4px 12px; font-size: 0.8rem;" @click="openFollow(combo)">立刻跟单</button>
                  </div>
                  <div style="padding: 16px; background: #f6fcfb; border: 1.5px dashed var(--green); border-radius: 8px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                      <span class="muted small" style="color: var(--green); font-weight: 500;">自主选 3 位数</span>
                      <strong class="number-code" style="font-size: 1.8rem; display: block; color: var(--green);">自选</strong>
                    </div>
                    <button type="button" class="primary" style="min-height: 36px; padding: 4px 12px; font-size: 0.8rem;" @click="openCustomOrder">自主选号</button>
                  </div>
                </div>
                <div v-else class="empty compact" style="margin-bottom: 0;">
                  <p>今日策略编制中</p>
                  <div style="display: flex; gap: 10px; justify-content: center; margin-top: 8px;">
                    <button type="button" class="primary" @click="openCustomOrder">🎯 自主选号</button>
                    <button type="button" @click="loadGlobal" :disabled="loading">刷新最新策略</button>
                  </div>
                </div>
              </div>
              <div class="client-calendar-quick" style="background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; margin-bottom: 28px;">
                <div class="section-heading" style="margin-bottom: 14px;">
                  <div>
                    <h2 style="font-size: 1.15rem;">近 30 天历史战绩日历</h2>
                    <p class="muted small">已核验 {{ verifiedCount }} 天 · 红 {{ hitCount }} 天 · 黑 {{ verifiedCount - hitCount }} 天 · 胜率 {{ verifiedCount ? Math.round(hitCount / verifiedCount * 100) : 0 }}%</p>
                  </div>
                  <button type="button" class="text-button" @click="switchView('calendar')">查看完整日历 <span aria-hidden="true">→</span></button>
                </div>
                <div class="calendar-grid">
                  <span v-for="blank in calendarPadding" :key="'blank-' + blank" aria-hidden="true"></span>
                  <button v-for="item in calendar" :key="item.date" type="button" :class="['day-cell', item.status ? item.status.toLowerCase() : 'pending-day', { 'is-today': item.date === bootstrap.today }]" @click="openDay(item)" :aria-label="item.date + '，' + statusLabel(item) + '，查看详情'">
                    <span>{{ item.date.slice(5).replace('-', '/') }}</span>
                    <strong>{{ item.status === 'Hit' ? '红' : item.status === 'Miss' ? '黑' : '待' }}</strong>
                    <small>{{ item.date === bootstrap.today ? '今天' : item.status || '待核验' }}</small>
                  </button>
                </div>
              </div>
            </template>

            <template v-if="role === 'manager'">
              <div class="workspace-tools"><a href="#manager-forms">前往建档与收支登记</a></div>
              <dl v-if="summary" class="metrics"><div><dt>名下客户已完成业务登记额</dt><dd>{{ money(summary.totalAmount) }}</dd></div><div><dt>店内存管待取</dt><dd>{{ storedCount }}<small> 份</small></dd></div><div><dt>已核算店长激励</dt><dd class="accent">{{ money(summary.managerIncentive) }}</dd></div></dl>
              <div id="manager-forms" class="manager-forms">
                <form @submit.prevent="saveClient"><h2>建立客户档案</h2><label>客户姓名<input v-model.trim="clientForm.name" required maxlength="80" autocomplete="off" :disabled="!!pending"></label><div class="form-row"><label>建档日期<input v-model="clientForm.date" type="date" :max="bootstrap.today" required :disabled="!!pending"></label><label>引荐来源<select v-model="clientForm.introducedByClientId" :disabled="!!pending"><option value="">店长直接建档</option><option v-for="item in ownClients" :key="item.id" :value="item.id">{{ item.name }}{{ !item.managerId ? '（归属待确认）' : '' }}</option></select></label></div><button type="submit" :disabled="!!pending">{{ pending === 'client' ? '建档中…' : '建立档案' }}</button><p v-if="formError && failedForm === 'client'" id="form-error-client" tabindex="-1" class="notice error" role="alert">{{ formError }}</p></form>
                <form id="adjustment-form" @submit.prevent="saveAdjustment"><h2>登记实际收支</h2><p v-if="adjustmentUnconfirmed" class="notice" role="alert">上次登记结果尚未确认。请重试确认本笔记录，系统会沿用同一登记编号，避免重复记账。</p><label>对账客户<select v-model="adjustmentForm.clientId" required :disabled="!!pending || adjustmentUnconfirmed"><option value="" disabled>选择名下客户</option><option v-for="item in ownClients" :key="item.id" :value="item.id">{{ item.name }} · 结余 {{ money(item.reconciliationBalance) }}</option></select></label><div class="form-row"><label>业务日期<input v-model="adjustmentForm.date" type="date" :max="bootstrap.today" required :disabled="!!pending || adjustmentUnconfirmed"></label><label>调整方向<select v-model="adjustmentForm.direction" :disabled="!!pending || adjustmentUnconfirmed"><option value="ADJUST_IN">增加结余</option><option value="ADJUST_OUT">核减结余</option></select></label></div><label>实际发生金额（元）<input id="adjustment-amount" v-model="adjustmentForm.amount" type="number" min="0.01" step="0.01" required placeholder="填写实际发生金额" :disabled="!!pending || adjustmentUnconfirmed"></label><label>调整原因<input v-model.trim="adjustmentForm.note" required maxlength="200" placeholder="说明实际收支的事由" :disabled="!!pending || adjustmentUnconfirmed"></label><div v-if="adjustmentClient" class="balance-preview" aria-live="polite"><span>当前结余 <strong>{{ money(adjustmentClient.reconciliationBalance) }}</strong></span><span>调整后 <strong>{{ adjustmentBalance === null ? '—' : money(adjustmentBalance) }}</strong></span><p v-if="adjustmentInvalid && !adjustmentUnconfirmed" class="field-error">{{ adjustmentInvalid }}</p></div><button type="submit" :disabled="!!pending || (!adjustmentUnconfirmed && (!ownClients.length || !!adjustmentInvalid))">{{ pending === 'adjustment' ? '登记中…' : adjustmentUnconfirmed ? '重试确认本笔记录' : '保存记录' }}</button><p v-if="formError && failedForm === 'adjustment'" id="form-error-adjustment" tabindex="-1" class="notice error" role="alert">{{ formError }}</p></form>
              </div>

        </label>
        <label style="grid-column: 1/-1; margin-top: 8px;">说明备注 (选填)
          <input v-model.trim="combo.note" placeholder="例如：建议均权配置 / 风险均衡" maxlength="100" :disabled="!!pending">
        </label>
      </div>
      <button type="submit" class="primary wide" :disabled="!!pending">
        {{ pending === 'portfolio-modal' ? '正在保存…' : (isEditingPortfolio ? '确认修改并立即生效' : '立即发布今日三组策略') }}
      </button>
    </form>
  </dialog>
  <dialog v-if="role === 'client'" ref="followDialog" class="drawer follow-drawer" aria-labelledby="follow-title" @click="$event.target === followDialog && followDialog.close()">
    <form class="drawer-content" @submit.prevent="submitFollowOrder">
      <div class="drawer-heading">
        <div>
          <h2 id="follow-title">确认跟单</h2>
        </div>
        <button type="button" class="icon-button" aria-label="关闭跟单弹窗" @click="followDialog.close()" :disabled="!!pending">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div style="background: var(--canvas); padding: 18px; border-radius: 10px; margin-bottom: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 0.9rem; color: var(--muted);">排列三选号组合</span>
          <strong class="number-code" style="font-size: 2.2rem; color: var(--green);">{{ followForm.selectedCode }}</strong>
        </div>
      </div>
      <div class="form-row">
        <label>注数（份数）
          <input v-model.number="followForm.quantity" type="number" min="1" max="1000" step="1" required :disabled="!!pending">
        </label>
        <label>倍投（倍数）
          <input v-model.number="followForm.multiplier" type="number" min="1" max="999" step="1" required :disabled="!!pending">
        </label>
      </div>
      <div class="balance-preview" style="margin-top: 20px;">
        <span>单注价格 <strong>¥2.00</strong></span>
        <span>本次需支付 <strong>¥{{ followTotalCost.toFixed(2) }}</strong></span>
        <span>当前账户余额 <strong>{{ client ? money(client.reconciliationBalance) : '¥0.00' }}</strong></span>
        <p v-if="client && client.reconciliationBalance < followTotalCost" class="field-error" style="color: #a02432; font-size: 0.88rem; margin-top: 8px;">
          当前预存余额不足（还缺 ¥{{ (followTotalCost - client.reconciliationBalance).toFixed(2) }}），请联系店长充值后再跟单。
        </p>
      </div>
      <button type="submit" class="primary wide" :disabled="!!pending || !client || client.reconciliationBalance < followTotalCost">
        {{ pending === 'follow' ? '正在下单扣款…' : '确认扣款并跟单 (¥' + followTotalCost.toFixed(2) + ')' }}
      </button>
    </form>
  </dialog>
  <dialog v-if="role === 'client'" ref="customDialog" class="drawer custom-drawer" aria-labelledby="custom-title" @click="$event.target === customDialog && customDialog.close()">
    <form class="drawer-content" @submit.prevent="submitCustomOrder">
      <div class="drawer-heading">
        <div>
          <h2 id="custom-title">排列三自主选号</h2>
        </div>
        <button type="button" class="icon-button" aria-label="关闭自选弹窗" @click="customDialog.close()" :disabled="!!pending">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <p v-if="formError && failedForm === 'custom-order'" class="notice error" role="alert">{{ formError }}</p>

      <div style="display: flex; gap: 8px; margin-bottom: 14px;">
        <button type="button" :class="['mode-tab', { primary: customForm.betMode === 'DIRECT' }]" @click="customForm.betMode = 'DIRECT'" style="flex: 1; min-height: 38px; font-size: 0.88rem;">直选</button>
        <button type="button" :class="['mode-tab', { primary: customForm.betMode === 'GROUP' }]" @click="customForm.betMode = 'GROUP'" style="flex: 1; min-height: 38px; font-size: 0.88rem;">组选</button>
      </div>

      <label>3 位数字
        <div style="display: flex; gap: 8px; margin-top: 6px;">
          <input v-model.trim="customForm.selectedCode" inputmode="numeric" pattern="[0-9]{3}" minlength="3" maxlength="3" required placeholder="890" :disabled="!!pending" style="font-size: 1.5rem; letter-spacing: 4px; text-align: center; font-weight: bold; color: var(--green); flex: 1; margin-top: 0;">
          <button type="button" @click="randomCustomCode" :disabled="!!pending" style="padding: 0 14px; font-size: 0.85rem; white-space: nowrap;">🎲 机选</button>
        </div>
      </label>

      <div v-if="customForm.betMode === 'DIRECT'" style="margin-top: 8px; font-size: 0.82rem; color: var(--muted);">
        顺序须完全一致 · 单注奖金 ¥1,040
      </div>
      <div v-else style="margin-top: 8px; font-size: 0.82rem;">
        <span v-if="!customGroupType" style="color: var(--muted);">不限顺序 · 组三 ¥346 · 组六 ¥173</span>
        <span v-else-if="!customGroupType.valid" style="color: #a02432; font-weight: 600;">⚠️ 豹子号（三位相同）不支持组选，请选直选</span>
        <span v-else style="color: var(--green); font-weight: 600;">✨ {{ customGroupType.label }} · 单注奖金 ¥{{ customGroupType.quota }}</span>
      </div>

      <div class="form-row" style="margin-top: 12px;">
        <label>注数
          <input v-model.number="customForm.quantity" type="number" min="1" max="1000" step="1" required :disabled="!!pending">
        </label>
        <label>倍投
          <input v-model.number="customForm.multiplier" type="number" min="1" max="999" step="1" required :disabled="!!pending">
        </label>
      </div>
      <div class="balance-preview" style="margin-top: 18px;">
        <span>单注 <strong>¥2.00</strong></span>
        <span>支付 <strong>¥{{ customTotalCost.toFixed(2) }}</strong></span>
        <span>余额 <strong>{{ client ? money(client.reconciliationBalance) : '¥0.00' }}</strong></span>
        <p v-if="client && client.reconciliationBalance < customTotalCost" class="field-error" style="color: #a02432; font-size: 0.88rem; margin-top: 8px;">
          余额不足（差 ¥{{ (customTotalCost - client.reconciliationBalance).toFixed(2) }}）
        </p>
      </div>
      <button type="submit" class="primary wide" :disabled="!!pending || !client || client.reconciliationBalance < customTotalCost || !/^[0-9]{3}$/.test(customForm.selectedCode) || (customForm.betMode === 'GROUP' && customGroupType && !customGroupType.valid)">
        {{ pending === 'custom-order' ? '正在投注扣款…' : '确认投注 (¥' + customTotalCost.toFixed(2) + ')' }}
      </button>
    </form>
  </dialog>
  <div class="toast" :class="{ visible: toast }" role="status" aria-live="polite">{{ toast }}</div>
  </template>
</div>
<noscript><p>请启用 JavaScript 以使用门店工作台。</p></noscript>
</body>
</html>
